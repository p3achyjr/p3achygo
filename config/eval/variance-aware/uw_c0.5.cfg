# Live play-time PUCT config, fresh tree every move.
n: 400
use_puct: true
use_lcb: true
c_puct: 1.0
c_puct_visit_scaling: 0.45
var_scale_cpuct: true
var_scale_prior_visits: 10
p_opt_weight: 1.0
root_fpu: 0.1
tree_reuse: false
# Exp 4: KataGo-style uncertainty-weighted backups, weight = c/(err + c/8), err = NN q6 error estimate.
uncertainty_weight_coeff: 0.5
uncertainty_max_weight: 8
